<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa374"/>
      <stop offset="100%" stop-color="#1a4d3a"/>
    </linearGradient>
  </defs>

  <!-- antenna -->
  <line x1="120" y1="18" x2="120" y2="42" stroke="#1a4d3a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="14" r="9" fill="#e8f5ef" stroke="#1a4d3a" stroke-width="4"/>

  <!-- head -->
  <rect x="45" y="42" width="150" height="110" rx="42" fill="url(#bodyGrad)"/>
  <rect x="45" y="42" width="150" height="110" rx="42" fill="none" stroke="#123c2e" stroke-width="4"/>

  <!-- face plate -->
  <rect x="66" y="66" width="108" height="62" rx="28" fill="#e8f5ef"/>

  <!-- eyes -->
  <circle cx="100" cy="97" r="10" fill="#1a4d3a"/>
  <circle cx="140" cy="97" r="10" fill="#1a4d3a"/>
  <circle cx="103" cy="94" r="3" fill="#ffffff"/>
  <circle cx="143" cy="94" r="3" fill="#ffffff"/>

  <!-- smile -->
  <path d="M104 112 Q120 124 136 112" stroke="#1a4d3a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- side ear circles -->
  <circle cx="42" cy="97" r="12" fill="#3aa374" stroke="#1a4d3a" stroke-width="4"/>
  <circle cx="198" cy="97" r="12" fill="#3aa374" stroke="#1a4d3a" stroke-width="4"/>

  <!-- body -->
  <rect x="70" y="150" width="100" height="80" rx="26" fill="#2d8659" stroke="#123c2e" stroke-width="4"/>

  <!-- chip / AI badge on chest -->
  <rect x="102" y="172" width="36" height="36" rx="8" fill="#e8f5ef" stroke="#1a4d3a" stroke-width="3"/>
  <text x="120" y="197" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" fill="#1a4d3a" text-anchor="middle">AI</text>

  <!-- arms -->
  <circle cx="58" cy="180" r="14" fill="#3aa374" stroke="#1a4d3a" stroke-width="4"/>
  <circle cx="182" cy="180" r="14" fill="#3aa374" stroke="#1a4d3a" stroke-width="4"/>
</svg>
