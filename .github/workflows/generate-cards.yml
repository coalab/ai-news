name: Daily Card News Generator

on:
  schedule:
    - cron: "10 23 * * *"   # 매일 오전 8:10 KST (기사 생성 이후)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate card news images
        run: python scripts/generate_cards.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          git commit -m "Card news: $(date +%Y-%m-%d)" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
