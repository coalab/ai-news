<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육실적 - 코아랩 AI 뉴스</title>
    <meta name="description" content="코아랩 이수현 대표 교육실적 - 학교, 기업, 대학, 공공기관 대상 AI·코딩·데이터 교육 이력.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background:#0b1120; color:#e5e7eb; }
        .chip{cursor:pointer;transition:all .15s}
        .chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
        tr.rowhide{display:none}
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="bg-[#0f172a] border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <span class="text-xl font-bold tracking-tight text-white">COALAB <span class="text-blue-500">교육실적</span></span>
            <div class="flex items-center gap-4">
                <a href="profile.html" class="text-sm font-medium text-slate-400 hover:text-blue-400">대표 소개</a>
                <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-blue-400">메인으로 돌아가기</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">교육실적</h1>
        <p class="text-slate-400 text-sm mb-6">학교·기업·대학·공공기관 대상 AI·코딩·데이터 교육 이력 (최신순)</p>

        <!-- Filter chips -->
        <div class="flex flex-wrap gap-2 mb-6" id="filters">
            <button class="chip active px-4 py-2 rounded-full border border-slate-700 text-sm text-slate-200" data-filter="all">전체</button>
            <button class="chip px-4 py-2 rounded-full border border-slate-700 text-sm text-slate-200" data-filter="학교">학교(초중고)</button>
            <button class="chip px-4 py-2 rounded-full border border-slate-700 text-sm text-slate-200" data-filter="기업">기업</button>
            <button class="chip px-4 py-2 rounded-full border border-slate-700 text-sm text-slate-200" data-filter="대학">대학</button>
            <button class="chip px-4 py-2 rounded-full border border-slate-700 text-sm text-slate-200" data-filter="공공">공공·지자체</button>
            <button class="chip px-4 py-2 rounded-full border border-slate-700 text-sm text-slate-200" data-filter="코아랩">코아랩·파주</button>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-800">
        <table class="w-full text-sm">
            <thead class="bg-[#0f172a] text-slate-400">
                <tr>
                    <th class="text-left px-4 py-3 font-medium">시기</th>
                    <th class="text-left px-4 py-3 font-medium">기업·기관</th>
                    <th class="text-left px-4 py-3 font-medium">과정명</th>
                    <th class="text-left px-4 py-3 font-medium">분류</th>
                </tr>
            </thead>
            <tbody id="records-body" class="divide-y divide-slate-800">
            </tbody>
        </table>
        </div>
    </main>

    <footer class="py-10 px-6 border-t border-slate-800 mt-10">
        <div class="max-w-6xl mx-auto text-center text-xs text-slate-500">COALAB AI NEWS &copy; 2026</div>
    </footer>

<script>
const records = [

];

const tbody = document.getElementById('records-body');
records.forEach(r => {
  const tr = document.createElement('tr');
  tr.dataset.cat = r[3];
  tr.className = 'hover:bg-slate-800/50';
  tr.innerHTML = `<td class="px-4 py-3 text-slate-400 whitespace-nowrap">${r[0]}</td>
                   <td class="px-4 py-3 font-medium text-white whitespace-nowrap">${r[1]}</td>
                   <td class="px-4 py-3 text-slate-300">${r[2]}</td>
                   <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${r[3]}</td>`;
  tbody.appendChild(tr);
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.filter;
  document.querySelectorAll('#records-body tr').forEach(tr => {
    tr.classList.toggle('rowhide', f !== 'all' && tr.dataset.cat !== f);
  });
});
</script>
</body>
</html>
